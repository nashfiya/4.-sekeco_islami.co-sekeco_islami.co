<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="cFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Heavy Beveled Gold Rim -->
    <linearGradient id="cGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Cylindrical Metal Side Depth -->
    <linearGradient id="cMetalSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="30%" stop-color="#B45309"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <!-- Dark Luxury Dial Face -->
    <radialGradient id="cDialFace" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="65%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Glass Dome Reflection -->
    <linearGradient id="cGlassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 3D Ka'bah Miniature Gold Kiswah Band -->
    <linearGradient id="cGoldBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Floor Shadow -->
  <ellipse cx="100" cy="162" rx="72" ry="22" fill="url(#cFloorShadow)"/>

  <!-- Thick Cylindrical Gold Casing (Side Depth Extrusion) -->
  <path d="M 32 96 C 32 128, 168 128, 168 96 L 168 116 C 168 148, 32 148, 32 116 Z" fill="url(#cMetalSide)"/>

  <!-- Outer Beveled Gold Ring -->
  <ellipse cx="100" cy="96" rx="68" ry="44" fill="url(#cGoldRim)" stroke="#78350F" stroke-width="1.5" filter="drop-shadow(2px 5px 5px rgba(0,0,0,0.3))"/>
  
  <!-- Inner Ring Recess -->
  <ellipse cx="100" cy="96" rx="58" ry="37" fill="#78350F"/>
  <ellipse cx="100" cy="97" rx="56" ry="35" fill="url(#cDialFace)"/>

  <!-- Compass Graduations (Ticks & Cardinal Marks) -->
  <g stroke="url(#cGoldBand)" stroke-width="1.2" opacity="0.75">
    <!-- North / South / East / West Ticks -->
    <line x1="100" y1="64" x2="100" y2="70"/>
    <line x1="100" y1="128" x2="100" y2="122"/>
    <line x1="46" y1="96" x2="54" y2="96"/>
    <line x1="154" y1="96" x2="146" y2="96"/>
    <!-- Diagonal Ticks -->
    <line x1="62" y1="74" x2="68" y2="79"/>
    <line x1="138" y1="74" x2="132" y2="79"/>
    <line x1="62" y1="118" x2="68" y2="113"/>
    <line x1="138" y1="118" x2="132" y2="113"/>
  </g>

  <!-- Cardinal Letter Labels -->
  <text x="100" y="77" fill="#FEF08A" font-size="8" font-weight="900" text-anchor="middle" font-family="sans-serif">N</text>
  <text x="142" y="99" fill="#94A3B8" font-size="7" font-weight="700" text-anchor="middle" font-family="sans-serif">E</text>
  <text x="100" y="123" fill="#94A3B8" font-size="7" font-weight="700" text-anchor="middle" font-family="sans-serif">S</text>
  <text x="58" y="99" fill="#94A3B8" font-size="7" font-weight="700" text-anchor="middle" font-family="sans-serif">W</text>

  <!-- Center 8-Point Compass Rose Inlay -->
  <g transform="translate(100, 96)" opacity="0.4">
    <polygon points="0,-24 4,-6 18,-6 6,2 10,18 0,8 -10,18 -6,2 -18,-6 -4,-6" fill="url(#cGoldBand)"/>
  </g>

  <!-- 3D KA'BAH MINIATURE CUBE at Qibla Heading (Top North-West Position) -->
  <g transform="translate(86, 68)" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.4))">
    <!-- Roof Rhombus -->
    <path d="M 0 -8 L 8 -13 L 16 -8 L 8 -3 Z" fill="#E2E8F0"/>
    <!-- Left Dark Wall -->
    <path d="M 0 -8 L 8 -3 L 8 9 L 0 4 Z" fill="#09090B"/>
    <!-- Right Wall -->
    <path d="M 8 -3 L 16 -8 L 16 4 L 8 9 Z" fill="#18181B"/>
    <!-- Gold Kiswah Belt (Hizam) on Both Walls -->
    <path d="M 0 -4 L 8 1 L 16 -4 L 16 -1 L 8 4 L 0 -1 Z" fill="url(#cGoldBand)"/>
    <!-- Golden Door (Bab al-Ka'bah) -->
    <rect x="9" y="1" width="3.5" height="5.5" rx="0.5" fill="url(#cGoldBand)"/>
  </g>

  <!-- 3D MAGNETIC QIBLA NEEDLE (Pointing towards Ka'bah with Faceted 3D Bevel) -->
  <g transform="translate(100, 96) rotate(-35)">
    <!-- North Pointer (Bright Ruby Red Faceted 3D Arrow) -->
    <polygon points="0,0 -5,-6 0,-34" fill="#DC2626" filter="drop-shadow(1px 3px 2px rgba(0,0,0,0.3))"/>
    <polygon points="0,0 5,-6 0,-34" fill="#EF4444"/>
    <polygon points="0,-18 0,-34 -3,-22" fill="#FFFFFF" opacity="0.6"/>

    <!-- South Pointer (Faceted Gold/Silver Arrow) -->
    <polygon points="0,0 -4,5 0,26" fill="#D97706"/>
    <polygon points="0,0 4,5 0,26" fill="#FBBF24"/>

    <!-- Center Pivot Pivot Pin (Jewel Bearing) -->
    <circle cx="0" cy="0" r="5.5" fill="url(#cGoldRim)" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.5))"/>
    <circle cx="0" cy="0" r="3.2" fill="#DC2626"/>
    <circle cx="-1" cy="-1" r="1.2" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Glass Convex Reflection Overlay -->
  <path d="M 44 80 C 44 60, 156 60, 156 80 C 130 68, 70 68, 44 80 Z" fill="url(#cGlassReflect)"/>
  <ellipse cx="72" cy="74" rx="14" ry="6" fill="#FFFFFF" opacity="0.3" transform="rotate(-15 72 74)"/>
</svg>