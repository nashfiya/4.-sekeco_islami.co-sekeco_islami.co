<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="uFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Polished Mahogany / Teak Wood -->
    <linearGradient id="uWoodTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="uWoodLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <linearGradient id="uWoodRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#5B2113"/>
    </linearGradient>

    <!-- Gold Mic & Accents -->
    <linearGradient id="uGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Velvet Banner -->
    <linearGradient id="uVelvet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#550A0A"/>
    </linearGradient>
  </defs>

  <!-- Floor Shadow -->
  <ellipse cx="100" cy="168" rx="68" ry="20" fill="url(#uFloorShadow)"/>

  <!-- Podium Base Step Plinth -->
  <path d="M 46 142 L 100 120 L 154 142 L 100 164 Z" fill="url(#uWoodTop)" stroke="#451A03" stroke-width="0.8"/>
  <path d="M 46 142 L 100 164 L 100 170 L 46 148 Z" fill="url(#uWoodLeft)"/>
  <path d="M 100 164 L 154 142 L 154 148 L 100 170 Z" fill="url(#uWoodRight)"/>

  <!-- Mimbar Wooden Steps (Tangga Mimbar Khotib on Left) -->
  <g transform="translate(10, 0)">
    <!-- Step 1 -->
    <path d="M 48 136 L 72 126 L 72 132 L 48 142 Z" fill="url(#uWoodLeft)"/>
    <path d="M 72 126 L 86 132 L 86 138 L 72 132 Z" fill="url(#uWoodRight)"/>
    <!-- Step 2 -->
    <path d="M 54 124 L 74 116 L 74 122 L 54 130 Z" fill="url(#uWoodLeft)"/>
  </g>

  <!-- Mimbar Main Tower / Podium Body -->
  <!-- Left Panel -->
  <path d="M 68 84 L 100 70 L 100 142 L 68 126 Z" fill="url(#uWoodLeft)" stroke="#451A03" stroke-width="0.8"/>
  <!-- Right Panel -->
  <path d="M 100 70 L 132 84 L 132 126 L 100 142 Z" fill="url(#uWoodRight)" stroke="#451A03" stroke-width="0.8"/>

  <!-- Islamic Carved Arched Backrest (Kubah Sandaran Mimbar) -->
  <path d="M 68 84 L 68 46 Q 100 22 132 46 L 132 84 Z" fill="url(#uWoodLeft)" stroke="#3B0505" stroke-width="1" filter="drop-shadow(1px 3px 3px rgba(0,0,0,0.3))"/>
  <!-- Gold Floral Calligraphic Arch Relief -->
  <path d="M 74 80 L 74 50 Q 100 30 126 50 L 126 80" stroke="url(#uGold)" stroke-width="2" fill="none"/>
  <circle cx="100" cy="42" r="3" fill="url(#uGold)"/>

  <!-- Slanted Lecturer Desk / Desktop (Meja Mimbar) -->
  <path d="M 64 80 L 100 62 L 136 80 L 100 98 Z" fill="url(#uWoodTop)" stroke="#451A03" stroke-width="1"/>
  <!-- Desktop Rim Depth -->
  <path d="M 64 80 L 100 98 L 100 102 L 64 84 Z" fill="url(#uWoodLeft)"/>
  <path d="M 100 98 L 136 80 L 136 84 L 100 102 Z" fill="url(#uWoodRight)"/>

  <!-- Velvet Front Runner with Gold Fringe (Taplak Mimbar) -->
  <path d="M 82 92 L 118 92 L 118 124 L 82 124 Z" fill="url(#uVelvet)" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.3))"/>
  <line x1="82" y1="124" x2="118" y2="124" stroke="url(#uGold)" stroke-width="2.5" stroke-dasharray="2,2"/>
  <circle cx="100" cy="106" r="5" fill="none" stroke="url(#uGold)" stroke-width="1.2"/>
  <polygon points="100,103 102,107 98,107" fill="url(#uGold)"/>

  <!-- Open Quran / Speech Notes on the Slanted Desk -->
  <g transform="translate(100, 78)">
    <polygon points="-12,-4 0,-9 12,-4 0,1" fill="#FAF5E8" stroke="#D7C9B2" stroke-width="0.5"/>
    <line x1="-8" y1="-3" x2="-2" y2="-6" stroke="#92400E" stroke-width="0.8"/>
    <line x1="2" y1="-6" x2="8" y2="-3" stroke="#92400E" stroke-width="0.8"/>
  </g>

  <!-- 3D METALLIC GOLD GOOSENECK MICROPHONE -->
  <g transform="translate(118, 70)" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.4))">
    <!-- Flange Base Mount -->
    <ellipse cx="0" cy="0" rx="3.5" ry="1.8" fill="url(#uGold)"/>
    <!-- Curved Gooseneck Stem -->
    <path d="M 0 0 C 0 -12, -8 -18, -12 -24" stroke="url(#uGold)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- Microphone Capsule Grille -->
    <g transform="translate(-12, -24) rotate(-30)">
      <rect x="-3" y="-8" width="6" height="9" rx="3" fill="#1C1917" stroke="url(#uGold)" stroke-width="0.8"/>
      <!-- Gold Acoustic Ring -->
      <line x1="-3" y1="-3" x2="3" y2="-3" stroke="url(#uGold)" stroke-width="1"/>
      <circle cx="0" cy="-6" r="1" fill="#FEF08A"/>
    </g>
  </g>
</svg>