<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="hFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Wood Rehal Gradients -->
    <linearGradient id="hWoodLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A16207"/>
      <stop offset="50%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <linearGradient id="hWoodDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="0%" stop-color="#713F12"/>
      <stop offset="100%" stop-color="#2D1103"/>
    </linearGradient>

    <!-- Open Pages Ivory Gradient -->
    <linearGradient id="hPageLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF5E8"/>
      <stop offset="80%" stop-color="#F5ECE0"/>
      <stop offset="100%" stop-color="#D7C9B2"/>
    </linearGradient>

    <linearGradient id="hPageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7C9B2"/>
      <stop offset="20%" stop-color="#F5ECE0"/>
      <stop offset="100%" stop-color="#FAF5E8"/>
    </linearGradient>

    <!-- Gold Trim -->
    <linearGradient id="hGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Floor Shadow -->
  <ellipse cx="100" cy="168" rx="70" ry="20" fill="url(#hFloorShadow)"/>

  <!-- Wooden Rehal X-Legs (3D Isometric Crossing Planks) -->
  <!-- Left Leg Going Back -->
  <polygon points="52,142 66,168 84,168 62,130" fill="url(#hWoodDark)"/>
  <!-- Right Leg Going Back -->
  <polygon points="148,142 134,168 116,168 138,130" fill="url(#hWoodDark)"/>

  <!-- Left Main Stand Plank -->
  <path d="M 42 110 L 96 152 L 104 148 L 48 104 Z" fill="url(#hWoodLight)" stroke="#451A03" stroke-width="0.8"/>
  <polygon points="48,104 104,148 104,154 48,110" fill="#451A03"/>

  <!-- Right Main Stand Plank (Crossing Front) -->
  <path d="M 158 110 L 104 152 L 96 148 L 152 104 Z" fill="url(#hWoodLight)" stroke="#451A03" stroke-width="0.8"/>
  <polygon points="152,104 96,148 96,154 152,110" fill="#2D1103"/>

  <!-- Rehal Carved Feet Arch -->
  <path d="M 66 168 Q 100 156 134 168 L 126 160 Q 100 150 74 160 Z" fill="url(#hWoodLight)"/>
  <!-- Islamic Arch Carving on Rehal -->
  <path d="M 88 152 Q 100 138 112 152 Z" fill="#2D1103" stroke="url(#hGold)" stroke-width="0.8"/>

  <!-- Thick Leather Cover Backing the Book -->
  <path d="M 32 78 Q 62 108 96 108 Q 100 108 104 108 Q 138 108 168 78 L 168 88 Q 138 118 100 118 Q 62 118 32 88 Z" fill="#6E1212" stroke="#450A0A" stroke-width="1"/>

  <!-- Stacked Gilded Page Edges (Thickness) -->
  <path d="M 36 84 Q 64 112 97 111 L 97 116 Q 64 117 36 89 Z" fill="url(#hGold)"/>
  <path d="M 164 84 Q 136 112 103 111 L 103 116 Q 136 117 164 89 Z" fill="url(#hGold)"/>

  <!-- Open Left Page Spread (Curved 3D Leaf) -->
  <path d="M 36 50 C 58 72, 78 88, 98 94 L 98 110 C 76 104, 56 88, 36 70 Z" fill="url(#hPageLeft)" stroke="#E5D9C4" stroke-width="0.6"/>
  <!-- Gold Page Rim Left -->
  <path d="M 36 50 L 36 70" stroke="url(#hGold)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Open Right Page Spread (Curved 3D Leaf) -->
  <path d="M 164 50 C 142 72, 122 88, 102 94 L 102 110 C 124 104, 144 88, 164 70 Z" fill="url(#hPageRight)" stroke="#E5D9C4" stroke-width="0.6"/>
  <!-- Gold Page Rim Right -->
  <path d="M 164 50 L 164 70" stroke="url(#hGold)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Valley Shadow at Book Spine -->
  <path d="M 97 93 L 103 93 L 103 110 L 97 110 Z" fill="#78350F" opacity="0.4"/>

  <!-- Left Page Hadith Calligraphy Text Lines -->
  <g stroke="#92400E" stroke-width="1.2" stroke-linecap="round" opacity="0.75">
    <line x1="48" y1="62" x2="88" y2="78"/>
    <line x1="46" y1="69" x2="90" y2="85"/>
    <line x1="46" y1="76" x2="88" y2="92"/>
    <line x1="48" y1="83" x2="84" y2="98"/>
  </g>
  <!-- Red Hadith Header Symbol -->
  <circle cx="68" cy="57" r="2" fill="#B91C1C"/>

  <!-- Right Page Hadith Calligraphy Text Lines -->
  <g stroke="#92400E" stroke-width="1.2" stroke-linecap="round" opacity="0.75">
    <line x1="112" y1="78" x2="152" y2="62"/>
    <line x1="110" y1="85" x2="154" y2="69"/>
    <line x1="112" y1="92" x2="154" y2="76"/>
    <line x1="116" y1="98" x2="152" y2="83"/>
  </g>
  <circle cx="132" cy="57" r="2" fill="#B91C1C"/>

  <!-- Draped Center Gold Silk Ribbon -->
  <path d="M 100 96 C 100 120, 96 138, 92 152 C 90 158, 86 166, 84 172 L 92 170 L 98 152 C 102 138, 104 120, 102 96 Z" fill="url(#hGold)" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.3))"/>
</svg>