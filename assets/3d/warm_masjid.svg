<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="mFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Volumetric Dome Gradient -->
    <radialGradient id="mDome" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="25%" stop-color="#991B1B"/>
      <stop offset="70%" stop-color="#6B1010"/>
      <stop offset="100%" stop-color="#3D0606"/>
    </radialGradient>

    <radialGradient id="mSmallDome" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="30%" stop-color="#059669"/>
      <stop offset="80%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </radialGradient>

    <!-- White/Cream Marble Walls (Isometric Faces) -->
    <linearGradient id="mWallLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E7E5E4"/>
      <stop offset="100%" stop-color="#D6D3D1"/>
    </linearGradient>

    <linearGradient id="mWallRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F5F4"/>
      <stop offset="100%" stop-color="#E7E5E4"/>
    </linearGradient>

    <linearGradient id="mWallTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F4"/>
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="mGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Interior Arch Warm Glow -->
    <linearGradient id="mArchGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
  </defs>

  <!-- Floor Shadow -->
  <ellipse cx="100" cy="168" rx="74" ry="20" fill="url(#mFloorShadow)"/>

  <!-- Base Marble Platform (Isometric Extrusion) -->
  <path d="M 40 144 L 100 120 L 160 144 L 100 168 Z" fill="url(#mWallTop)" stroke="#D6D3D1" stroke-width="0.8"/>
  <path d="M 40 144 L 100 168 L 100 174 L 40 150 Z" fill="url(#mWallLeft)"/>
  <path d="M 100 168 L 160 144 L 160 150 L 100 174 Z" fill="url(#mWallRight)"/>

  <!-- Mosque Main Hall Building -->
  <!-- Left Wall -->
  <path d="M 56 102 L 100 84 L 100 144 L 56 128 Z" fill="url(#mWallLeft)" stroke="#E7E5E4" stroke-width="0.6"/>
  <!-- Right Wall -->
  <path d="M 100 84 L 144 102 L 144 128 L 100 144 Z" fill="url(#mWallRight)" stroke="#E7E5E4" stroke-width="0.6"/>
  <!-- Roof Slab -->
  <path d="M 56 102 L 100 82 L 144 102 L 100 120 Z" fill="url(#mWallTop)"/>

  <!-- Left Minaret (Tall Volumetric 3D Cylinder & Balcony) -->
  <g transform="translate(44, 52)">
    <path d="M -7 40 L -7 96 L 7 96 L 7 40 Z" fill="url(#mWallLeft)"/>
    <path d="M 0 40 L 7 40 L 7 96 L 0 96 Z" fill="url(#mWallRight)"/>
    <!-- Minaret Balcony -->
    <ellipse cx="0" cy="40" rx="9" ry="3.5" fill="url(#mGold)"/>
    <!-- Upper Gallery -->
    <path d="M -5 18 L -5 40 L 5 40 L 5 18 Z" fill="url(#mWallLeft)"/>
    <!-- Spire Dome -->
    <path d="M -5 18 Q 0 4 5 18 Z" fill="url(#mDome)"/>
    <!-- Gold Finial & Crescent -->
    <line x1="0" y1="4" x2="0" y2="-2" stroke="url(#mGold)" stroke-width="1.5"/>
    <circle cx="0" cy="-3" r="1.5" fill="#FDE047"/>
  </g>

  <!-- Right Minaret -->
  <g transform="translate(156, 52)">
    <path d="M -7 40 L -7 96 L 7 96 L 7 40 Z" fill="url(#mWallLeft)"/>
    <path d="M 0 40 L 7 40 L 7 96 L 0 96 Z" fill="url(#mWallRight)"/>
    <!-- Minaret Balcony -->
    <ellipse cx="0" cy="40" rx="9" ry="3.5" fill="url(#mGold)"/>
    <!-- Upper Gallery -->
    <path d="M -5 18 L -5 40 L 5 40 L 5 18 Z" fill="url(#mWallLeft)"/>
    <!-- Spire Dome -->
    <path d="M -5 18 Q 0 4 5 18 Z" fill="url(#mDome)"/>
    <!-- Gold Finial & Crescent -->
    <line x1="0" y1="4" x2="0" y2="-2" stroke="url(#mGold)" stroke-width="1.5"/>
    <circle cx="0" cy="-3" r="1.5" fill="#FDE047"/>
  </g>

  <!-- Grand Central 3D Volumetric Dome (Maroon & Gold Luxury) -->
  <g transform="translate(100, 78)" filter="drop-shadow(2px 6px 5px rgba(0,0,0,0.35))">
    <!-- Cylindrical Drum Base -->
    <path d="M -30 16 L -30 26 C -30 36, 30 36, 30 26 L 30 16 Z" fill="url(#mWallTop)"/>
    <!-- Drum Windows -->
    <ellipse cx="-16" cy="22" rx="2.5" ry="4" fill="#78350F"/>
    <ellipse cx="0" cy="24" rx="2.5" ry="4" fill="#78350F"/>
    <ellipse cx="16" cy="22" rx="2.5" ry="4" fill="#78350F"/>
    <!-- Gold Drum Belt -->
    <path d="M -30 16 C -30 24, 30 24, 30 16" stroke="url(#mGold)" stroke-width="2" fill="none"/>

    <!-- Onion Bulb Dome Curve -->
    <path d="M -30 16 C -36 2, -26 -26, 0 -36 C 26 -26, 36 2, 30 16 C 20 22, -20 22, -30 16 Z" fill="url(#mDome)"/>
    
    <!-- Specular Highlight Curve on Dome -->
    <path d="M -16 6 C -20 -4, -14 -22, -2 -28 C -4 -20, -10 -4, -6 6 Z" fill="#FFFFFF" opacity="0.35"/>

    <!-- Gold Dome Ribs / Petals -->
    <path d="M 0 -36 C -12 -18, -16 6, -16 19" stroke="url(#mGold)" stroke-width="1" fill="none" opacity="0.75"/>
    <path d="M 0 -36 C 12 -18, 16 6, 16 19" stroke="url(#mGold)" stroke-width="1" fill="none" opacity="0.75"/>
    <path d="M 0 -36 L 0 20" stroke="url(#mGold)" stroke-width="1.2" opacity="0.8"/>

    <!-- Golden Hilal (Crescent Moon) Finial -->
    <line x1="0" y1="-36" x2="0" y2="-48" stroke="url(#mGold)" stroke-width="2.5"/>
    <circle cx="0" cy="-40" r="2.5" fill="#FDE047"/>
    <circle cx="0" cy="-45" r="2" fill="#FDE047"/>
    <!-- Crescent -->
    <path d="M -4 -51 A 5 5 0 1 1 3 -44 A 4 4 0 1 0 -4 -51 Z" fill="url(#mGold)"/>
  </g>

  <!-- Front Portal / Grand Arched Iwan Gate -->
  <g transform="translate(100, 130)">
    <!-- Arch Frame Portal -->
    <path d="M -16 22 L -16 -12 C -16 -24, 16 -24, 16 -12 L 16 22 Z" fill="#FAF7F2" stroke="url(#mGold)" stroke-width="1.5" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.2))"/>
    <!-- Arch Portal Interior with Warm Amber Lamp Glow -->
    <path d="M -12 22 L -12 -8 C -12 -18, 12 -18, 12 -8 L 12 22 Z" fill="url(#mArchGlow)"/>
    <!-- Arabic Filigree Lattice Screen at Arch Top -->
    <path d="M -8 -8 Q 0 -16 8 -8 Z" fill="url(#mGold)" opacity="0.8"/>
  </g>

  <!-- Front Steps Leading to Mosque -->
  <path d="M 80 156 L 100 148 L 120 156 L 100 164 Z" fill="url(#mWallTop)"/>
  <path d="M 76 160 L 100 151 L 124 160 L 100 169 Z" fill="#E7E5E4"/>
</svg>